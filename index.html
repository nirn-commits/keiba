<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダービー牧場物語</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🐎</span><span id="farmName">ダービー牧場物語</span></div>
    <div class="status">
      <span id="dateLabel" class="date"></span>
      <span id="seasonLabel" class="badge"></span>
      <span id="moneyLabel" class="money"></span>
    </div>
    <button id="btnSave" class="btn big" data-act="slots">セーブ</button>
    <button id="btnNext" class="btn primary big" data-act="next">次の週へ ▶</button>
  </header>
  <nav id="tabs" class="tabs"></nav>
  <main id="view" class="view"></main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" data-act="closeModal" aria-label="閉じる">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/genetics.js"></script>
  <script src="js/world.js"></script>
  <script src="js/race.js"></script>
  <script src="js/game.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
